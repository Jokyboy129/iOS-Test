name: SleepEngine
options:
  bundleIdPrefix: com.localdev
targets:
  SleepEngine:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "Required to play your selected Apple Music tracks in the ASMR Soundscape."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.localdev.SleepEngine
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1