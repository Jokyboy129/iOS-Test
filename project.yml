name: SleepEngine
packages:
  Tidal:
    url: https://github.com/tidal-music/tidal-sdk-ios
    branch: main
options:
  bundleIdPrefix: com.localdev
  developmentLanguage: en
  localizations:
    - en
    - de
targets:
  SleepEngine:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Sources]
    dependencies:
      - package: Tidal
        product: Auth
      - package: Tidal
        product: Player
      - package: Tidal
        product: EventProducer
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "Required to play your selected Apple Music tracks in the ASMR Soundscape."
        NSCameraUsageDescription: "Required to measure your heart rate using the camera."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.localdev.SleepEngine
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1